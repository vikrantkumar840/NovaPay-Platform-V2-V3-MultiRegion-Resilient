apiVersion: v1
kind: Secret

metadata:
  name: alertmanager-config
  namespace: monitoring

stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: pagerduty
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: pagerduty
        pagerduty_configs:
          - routing_key: "<PAGERDUTY_INTEGRATION_KEY>"
            severity: critical