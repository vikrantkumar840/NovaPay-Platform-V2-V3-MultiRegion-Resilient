apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: external-secrets
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/vikrantkumar840/NovaPay-Platform-V2-V3-MultiRegion-Resilient.git
    targetRevision: main
    path: platform/secrets/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true