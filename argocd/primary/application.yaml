apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: novapay-primary

spec:
  project: novapay-primary

  source:
    repoURL: https://github.com/vikrantkumar840/NovaPay-Platform-V2-MultiRegion-Resilient.git
    targetRevision: main
    path: kubernetes/primary

  destination:
    server: https://kubernetes.default.svc
    namespace: novapay

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
