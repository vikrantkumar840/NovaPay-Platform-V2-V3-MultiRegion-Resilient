apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay
  namespace: novapay
spec:
  replicas: 1

  selector:
    matchLabels:
      app: novapay

  template:
    metadata:
      labels:
        app: novapay

    spec:
      containers:
      - name: novapay
        image: nginx:latest

        ports:
        - containerPort: 80
