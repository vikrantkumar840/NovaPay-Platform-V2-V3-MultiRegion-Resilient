apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: novapay-rollout

spec:
  replicas: 2

  selector:
    matchLabels:
      app: novapay

  template:
    metadata:
      labels:
        app: novapay

    spec:
      containers:
      - name: novapay
        image: 187478112406.dkr.ecr.ap-south-1.amazonaws.com/novapay:stable
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause:
          duration: 60s

      - setWeight: 50
      - pause:
          duration: 120s

      - setWeight: 100
